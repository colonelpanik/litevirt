name: CI

on:
  push:
    branches: [main]
    tags: ['v*'] # a pushed version tag (e.g. v1.2.0) cuts a release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The UI embeds uPlot, which is fetched from a CDN (gitignored). Vendor it
      # so the embedded asset set matches a real build.
      - name: Vendor UI assets
        run: make vendor-js

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit tests + the in-process fleet integration suite. The tests/e2e and
      # tests/cluster suites are intentionally excluded: they require a live
      # multi-host cluster with PKI under /etc/litevirt and root privileges.
      - name: Test
        run: go test ./internal/... ./cmd/... ./tests/fleet/

  # CI guardrails (see docs/upgrades.md → CI guardrails). Runs the `ci-guards`
  # make target rather than re-listing its steps here: this job previously
  # inlined a subset, so a guardrail added to the Makefile (stmtshapecheck) ran
  # locally and silently never ran in CI. Delegating keeps the two in lockstep —
  # a new guard is picked up here the moment it joins the target.
  #
  # The heart of it is the schema-versioning guard: a CREATE TABLE / ALTER /
  # index added to internal/corrosion/schema.go must come with a
  # CurrentSchemaVersion bump, or the mixed-version replication skew check can't
  # tell a peer is out of date. That check needs the diff between base and head,
  # which is why this job checks out full history.
  ci-guards:
    # The display name is pinned: branch protection on main requires a status
    # check with this exact name, and a rename here means the required check
    # never reports and every PR is blocked with green CI. Rename only together
    # with the branch-protection setting (repo admin), after in-flight PRs
    # carrying the old name have merged or rebased. The job now runs all of
    # `make ci-guards`, of which the schema guard is one part.
    name: Schema version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base history to detect schema growth

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Guardrails (schema bump, writecheck, stmtshapecheck, docs truth)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: make ci-guards

  release:
    name: Release
    needs: test
    # Only on a pushed version tag (v*). The tag name is the release version,
    # so cut a release with e.g. `git tag v1.2.0 && git push origin v1.2.0`.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }} # the tag, e.g. v1.2.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vendor UI assets
        run: make vendor-js

      # Cross-compile the linux + darwin (client-only) binaries, tar them, and
      # write a checksums file. Logic lives in the script (workflow-script policy).
      - name: Build release binaries
        env:
          COMMIT: ${{ github.sha }}
        run: ./scripts/ci/build-release.sh

      # Publish the tarballs + checksums as a GitHub release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*.tar.gz dist/*checksums.txt

      # Regenerate the Homebrew formula and push it to the tap. No-ops until the
      # HOMEBREW_TAP_REPO variable + HOMEBREW_TAP_TOKEN secret are configured.
      - name: Publish Homebrew formula
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          REPO: ${{ github.repository }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: ./scripts/ci/brew-formula.sh
